<!DOCTYPE html>
<html lang="zh"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>注意力训练 · 掉落物品</title>
<style>
:root{
  --bg:#f6f5f1;--fg:#222;--card:#fff;--ac:#2f7d6d;--bad:#d64545;--mut:#777;
  --item:clamp(36px,16vw,88px);
  --icon:clamp(26px,7vw,52px);
  --arrow:clamp(28px,8.5vw,64px);
  --title:clamp(26px,7vw,48px);
  --hud:clamp(15px,4.2vw,22px);
  --text:clamp(13px,3.6vw,17px);
  --gap:clamp(6px,1.6vw,12px);
  --pad:clamp(8px,2vw,16px);
  --radius:clamp(12px,3vw,20px);
  --col:min(680px,100%);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#181a19;--fg:#eee;--card:#262a28;--ac:#5cc2ad;--bad:#ef6b6b;--mut:#999}}
:root[data-theme="dark"]{--bg:#181a19;--fg:#eee;--card:#262a28;--ac:#5cc2ad;--bad:#ef6b6b;--mut:#999}
*{box-sizing:border-box}
html{height:100%;background:var(--bg);-webkit-text-size-adjust:100%}
body{
  position:fixed;inset:0;margin:0;height:100%;height:100dvh;width:100%;
  background:var(--bg);color:var(--fg);
  font-family:-apple-system,"PingFang SC","Noto Sans SC",sans-serif;
  display:flex;justify-content:center;
  padding:
    max(var(--pad),env(safe-area-inset-top))
    max(var(--pad),env(safe-area-inset-right))
    max(var(--pad),env(safe-area-inset-bottom))
    max(var(--pad),env(safe-area-inset-left));
  overflow:hidden;user-select:none;-webkit-user-select:none;
  -webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;
  touch-action:manipulation;overscroll-behavior:none;
}
#app{
  width:var(--col);height:100%;min-width:0;min-height:0;
  display:flex;flex-direction:column;align-items:stretch;gap:var(--gap);
}
.top{
  flex:0 0 auto;display:flex;justify-content:space-between;align-items:center;
  gap:12px;width:100%;font-size:var(--hud);font-variant-numeric:tabular-nums;
}
#stage{
  position:relative;flex:1 1 auto;min-width:0;min-height:0;width:100%;
  background:var(--card);border-radius:var(--radius);overflow:hidden;
}
.item{
  position:absolute;left:50%;top:0;transform:translateX(-50%);
  font-size:var(--item);line-height:1.2;
}
.item.low{filter:drop-shadow(0 0 10px var(--ac))}
#overlay{
  position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
  justify-content:center;justify-content:safe center;gap:clamp(8px,2vw,14px);
  background:var(--card);text-align:center;padding:clamp(12px,3vw,20px);overflow:auto;
}
#overlay p{color:var(--mut);margin:0;max-width:28em;font-size:var(--text);line-height:1.45}
#big{font-size:var(--title);font-weight:700;line-height:1.15}
.row{flex:0 0 auto;display:flex;gap:clamp(8px,2vw,12px);width:100%;min-width:0}
.arrow{
  flex:1;min-width:0;min-height:44px;border:0;border-radius:var(--radius);
  background:var(--card);color:var(--fg);font:inherit;
  padding:clamp(6px,1.4vw,12px) 4px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  cursor:pointer;touch-action:manipulation;
}
.arrow .ic{font-size:var(--icon);line-height:1.1}
.arrow .ar{font-size:var(--arrow);line-height:1;color:var(--ac)}
.arrow.ok{background:var(--ac);color:#fff}
.arrow.no{background:var(--bad);color:#fff}
.arrow.ok .ar,.arrow.no .ar{color:#fff}
button.s{
  font:inherit;border:0;border-radius:12px;
  padding:clamp(10px,2vw,14px) clamp(20px,5vw,32px);
  background:var(--ac);color:#fff;font-size:clamp(16px,4.2vw,20px);
  cursor:pointer;max-width:100%;
}
.lv{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}
.lv button{
  font:inherit;font-size:clamp(14px,3.4vw,16px);
  border:0;border-radius:10px;padding:clamp(6px,1.4vw,8px) clamp(12px,3vw,16px);
  background:var(--bg);color:var(--fg);cursor:pointer;
}
.lv button.on{background:var(--ac);color:#fff}
button:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
@media (max-height:560px){
  :root{--gap:6px;--pad:8px;--arrow:clamp(22px,6.5vw,40px);--icon:clamp(20px,5.5vw,34px);--title:clamp(22px,5.5vw,32px)}
  .arrow{padding:6px 4px}
  button.s{padding:8px 18px}
}
@media (max-height:520px) and (min-width:640px){
  :root{--col:min(1100px,100%);--arrow:clamp(36px,10vmin,60px);--icon:clamp(32px,8vmin,52px);--title:clamp(24px,5vmin,36px)}
  #app{
    display:grid;
    grid-template-columns:minmax(0,1fr) clamp(128px,22vw,210px);
    grid-template-rows:auto minmax(0,1fr);
    grid-template-areas:"hud hud" "stage controls";
  }
  .top{grid-area:hud}
  #stage{grid-area:stage}
  .row{grid-area:controls;flex-direction:column;width:auto}
  .arrow{flex:1}
}
</style></head><body>
<div id="app">
<div class="top"><span>得分：<b id="score">0</b></span><span>第 <b id="cnt">0</b>/10 个</span></div>
<div id="stage">
  <div id="overlay">
    <div id="big">注意力训练</div>
    <p>物品会从上方慢慢掉落。<br>看最下面的那一个，按对应的箭头。<br>对 +10 分，错 −10 分，共 10 个。</p>
    <div class="lv" id="lv"></div>
    <button class="s" id="go">开始</button>
  </div>
</div>
<div class="row">
  <button class="arrow" id="bL" type="button"><span class="ic" id="iL"></span><span class="ar">←</span></button>
  <button class="arrow" id="bR" type="button"><span class="ic" id="iR"></span><span class="ar">→</span></button>
</div>
</div>
<script>
const $=id=>document.getElementById(id);
const PAIRS=[['🍎','🐟'],['🐶','🚗'],['🌻','⭐']];
const LEVELS={'慢':9,'中':7,'快':5}; // seconds to fall
let runId=0,gap=0,lvl='慢',types,items=[],score,spawned,done,running,last,itemPx=64;
const TOTAL=10;
function syncLayout(){
  const st=$('stage'),H=st.clientHeight,W=st.clientWidth;
  if(!H||!W)return {size:itemPx,visual:itemPx,end:1};
  const size=Math.round(Math.min(96,Math.max(28,Math.min(W*0.18,H*0.2))));
  if(size!==itemPx){itemPx=size;document.documentElement.style.setProperty('--item',size+'px')}
  let probe=$('probe');
  if(!probe){
    probe=document.createElement('div');probe.id='probe';probe.className='item';
    probe.textContent='🌻';probe.setAttribute('aria-hidden','true');
    probe.style.visibility='hidden';probe.style.pointerEvents='none';st.appendChild(probe);
  }
  const visual=Math.max(size,Math.round(probe.getBoundingClientRect().height)||size);
  const margin=Math.max(6,Math.round(visual*0.08));
  return {size,visual,end:Math.max(1,H-visual-margin)};
}
function lvUI(){const d=$('lv');d.innerHTML='';Object.keys(LEVELS).forEach(k=>{const b=document.createElement('button');b.type='button';b.textContent=k;if(k===lvl)b.className='on';b.onclick=()=>{lvl=k;lvUI()};d.appendChild(b)})}
function start(){
  const st=$('stage');items.forEach(i=>i.el.remove());
  types=PAIRS[Math.floor(Math.random()*PAIRS.length)].slice();
  if(Math.random()<.5)types.reverse();
  $('iL').textContent=types[0];$('iR').textContent=types[1];
  items=[];score=0;spawned=0;done=0;const id=++runId;gap=0;running=true;last=performance.now();
  $('overlay').style.display='none';upd();syncLayout();requestAnimationFrame(t=>loop(t,id));
}
function upd(){$('score').textContent=score;$('cnt').textContent=done;}
function loop(t,id){
  if(!running||id!==runId)return;
  const {end,visual}=syncLayout();
  const speed=end/LEVELS[lvl];
  const dt=(t-last)/1000;last=t;
  if(spawned<TOTAL&&items.length<3&&(!items.length||items[items.length-1].y>=gap)){
    gap=visual+Math.max(10,visual*0.12)+Math.random()*8;
    const type=Math.random()<.5?0:1;
    const el=document.createElement('div');el.className='item';el.textContent=types[type];el.style.top='0px';$('stage').appendChild(el);
    items.push({el,type,y:0});spawned++;
  }
  items.forEach(i=>{i.y+=speed*dt;i.el.style.top=i.y+'px'});
  // items reaching bottom are missed (0 points)
  while(items.length&&items[0].y>=end){remove(items[0],0)}
  items.forEach(i=>i.el.classList.remove('low'));
  if(items.length)items[0].el.classList.add('low');
  if(running&&id===runId)requestAnimationFrame(t2=>loop(t2,id));
}
function remove(it,delta){
  it.el.remove();items.splice(items.indexOf(it),1);
  score+=delta;done++;upd();
  if(done>=TOTAL)finish();
}
function press(side){
  if(!running||!items.length)return;
  const it=items[0]; // items are ordered by spawn = lowest first
  const ok=it.type===side;
  const b=side?$('bR'):$('bL');b.classList.add(ok?'ok':'no');setTimeout(()=>b.classList.remove('ok','no'),250);
  remove(it,ok?10:-10);
}
function finish(){
  running=false;
  $('big').textContent=score+' 分';
  $('overlay').querySelector('p').innerHTML=score>=100?'满分！':'满分 100 分，再试一次？';
  $('go').textContent='再来一局';$('overlay').style.display='flex';
}
$('go').onclick=start;$('bL').onclick=()=>press(0);$('bR').onclick=()=>press(1);
document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();press(e.key==='ArrowRight'?1:0)}});
if(window.ResizeObserver)new ResizeObserver(()=>syncLayout()).observe($('stage'));
window.addEventListener('resize',syncLayout);
if(window.visualViewport)visualViewport.addEventListener('resize',syncLayout);
lvUI();syncLayout();
</script></body></html>
